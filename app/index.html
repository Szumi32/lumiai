<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LumiAI App</title>
<meta name="description" content="Projekt aplikacji mobilnej LumiAI: tłumacz, zdrowie, sen, soczewka, sklep i płatności.">
<meta property="og:title" content="LumiAI App">
<meta property="og:description" content="Projekt aplikacji mobilnej LumiAI: tłumacz, zdrowie, sen, soczewka, sklep i płatności.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0B0C0E">
<meta name="robots" content="index,follow">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script>try{var t=localStorage.getItem('lumi-app-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="phone" id="phone">
  <div class="scr-wrap" id="wrap">
    <div class="island" id="island" aria-hidden="true"><div class="il" id="ilt"></div></div>
    <div class="sbar" aria-hidden="true"><span id="clock">14:10</span><span class="r"><svg viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="1"/><rect x="9" y="3" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>5G<svg viewBox="0 0 26 12" fill="none" style="width:25px"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".4"/></svg></span></div>
    <header class="appbar" id="appbar">
      <button class="ib ghost" id="back" type="button" aria-label="Wstecz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="sm" id="ttl">Start</span>
      <button class="ib" id="bell" type="button" aria-label="Powiadomienia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0"/></svg><i class="dotn" id="belld"></i></button>
    </header>
    <main class="stage" id="stage"></main>
    <nav class="tabs" id="tabs" aria-label="Główna nawigacja"><span class="ind" id="tabind"></span></nav>
    <div class="paybar" id="paybar"></div>
    <div id="layer"></div>
    <div class="splash" id="splash" aria-hidden="true">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14"/><circle cx="16" cy="16" r="8.5"/><circle cx="16" cy="16" r="3"/></svg>
      <b>LUMIAI</b>
      <small>Łączenie z soczewką…</small>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
